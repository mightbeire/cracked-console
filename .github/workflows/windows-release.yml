name: Windows Release Build

on:
  push:
    branches:
      - main
      - agent/v3-resource-reconciliation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run release:check

      - name: Check Rust backend with committed lockfile
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: cracked-console-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable release executable
        uses: actions/upload-artifact@v4
        with:
          name: cracked-console-windows-portable
          path: src-tauri/target/release/cracked-console.exe
          if-no-files-found: error
          retention-days: 14
